# The WAN interface to your ISP where the DHCP requests will go
EXT_IFACE="eth1"
# Your internal interface. If you have more than one, just put one here
INT_IFACE="eth0"
# space-separated list of additional interfaces that also need IPv6configuration
OTHER_FACES=""
# Which DHCP client to use: dhclient, or dhcpcd. With dhcpcd, what to request
# and how to assign it to your interfaces is configured in dhcpcd.conf
# instead, and SEPARATE_NETS is ignored.
DHCP_CLIENT="dhclient"
# Which RA daemon to use: radvd, or dnsmasq
RA_DAEMON="radvd"
# By default we request one /60 and divide it among all of the interfaces
# However, we can instead request individual /64s for each of your interfaces
# Some ISPs prefer one over the other.
# On Comcast, if you request multiple /64s, you'll get them, but only one
# will be routable
# However, if you want to try that, set this to 1.
# Note that not using separate nets (=0) requires a working python3 installation,
# but separate notes (=1) does not.
SEPARATE_NETS=0
# In addition to the prefix(es), request a single address (IA_NA) for the
# gateway itself and assign it to EXT_IFACE. Set to 0 to disable.
REQUEST_ADDRESS=1
